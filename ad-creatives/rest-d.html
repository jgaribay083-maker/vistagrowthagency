<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8">
<style>
@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800;900&family=Inter:wght@300;400;500;600;700;800;900&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1350px;overflow:hidden;font-family:'Inter',sans-serif}
.ad{width:1080px;height:1350px;position:relative;overflow:hidden;background:#070707;color:#fff;display:flex;flex-direction:column;align-items:center;padding:56px 52px 46px}
.ad::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse 70% 42% at 50% 5%,rgba(212,175,55,.15),transparent 60%),radial-gradient(ellipse 80% 45% at 50% 103%,rgba(212,175,55,.10),transparent 55%)}
.ad::after{content:'';position:absolute;inset:14px;border:1px solid rgba(212,175,55,.26);border-radius:26px;pointer-events:none}
.inner{position:relative;z-index:2;width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:space-between}
.logo{font-family:'Playfair Display',serif;font-weight:900;font-size:40px;letter-spacing:8px;color:#D4AF37;line-height:1}
.logo small{display:block;font-family:'Inter';font-weight:300;font-size:12px;letter-spacing:8px;color:#8a8a8a;text-transform:uppercase;margin-top:6px}
h1{text-align:center;margin-top:0;font-family:'Playfair Display',serif;font-weight:900;font-size:64px;line-height:1;letter-spacing:-1px}
h1 em{font-style:normal;color:#D4AF37;display:block}
.sub{text-align:center;font-size:21px;letter-spacing:3.5px;text-transform:uppercase;color:#a3a3a3;margin-top:14px;font-weight:400}
.grid{width:100%;margin-top:0;display:flex;gap:16px}
.card{flex:1;background:#0e0e0e;border-radius:12px;overflow:hidden;border:1px solid rgba(255,255,255,.12);box-shadow:0 34px 66px -28px rgba(0,0,0,.92),0 0 60px -34px rgba(212,175,55,.5)}
.card .bar{height:26px;background:#1a1a1a;display:flex;align-items:center;gap:5px;padding:0 10px}
.card .bar i{width:7px;height:7px;border-radius:99px;display:block;background:#3a3a3a}
.card .shot{height:470px;overflow:hidden}
.card img{display:block;width:100%;height:auto}
.names{width:100%;margin-top:16px;display:flex;gap:16px}
.names div{flex:1;text-align:center;font-size:15px;color:#9a9a9a;letter-spacing:1.4px;text-transform:uppercase;font-weight:600}
.feats{width:100%;margin-top:0;display:flex;flex-wrap:wrap;justify-content:center;gap:12px}
.feats span{border:1px solid rgba(212,175,55,.3);background:rgba(212,175,55,.07);border-radius:99px;padding:12px 24px;font-size:19px;color:#e8d9a3;font-weight:600}
.offer{padding-top:0;text-align:center}
.offer .price{font-family:'Playfair Display',serif;font-weight:900;font-size:112px;line-height:.88;color:#fff}
.offer .price b{color:#D4AF37}
.offer .pay{font-size:19px;letter-spacing:2.5px;text-transform:uppercase;color:#c9c9c9;font-weight:500;margin-top:10px}
.offer .pay b{color:#fff;font-weight:800}
.cta{margin-top:26px;width:100%;background:#25d366;border-radius:15px;display:flex;align-items:center;justify-content:center;gap:15px;padding:22px;box-shadow:0 22px 46px -22px rgba(37,211,102,.85)}
.cta svg{width:37px;height:37px;fill:#04230f}
.cta .txt{color:#04230f}
.cta .txt b{display:block;font-size:26px;font-weight:900;line-height:1}
.cta .txt span{font-size:15px;font-weight:600;opacity:.82}
</style></head><body>
<div class="ad"><div class="inner">
  <div class="logo">VGA<small>Vista Growth Agency</small></div>
  <h1>Así se ve tu negocio<em>cuando tiene página</em></h1>
  <div class="sub">Páginas para restaurantes en Arizona</div>
  <div class="grid">
    <div class="card"><div class="bar"><i></i><i></i><i></i></div><div class="shot"><img src="tall-guero.jpg" alt=""></div></div>
    <div class="card"><div class="bar"><i></i><i></i><i></i></div><div class="shot"><img src="tall-victors.jpg" alt=""></div></div>
    <div class="card"><div class="bar"><i></i><i></i><i></i></div><div class="shot"><img src="tall-tapatio.jpg" alt=""></div></div>
  </div>
  <div class="names"><div>El Güero</div><div>El Victor's</div><div>Tacos Tapatío</div></div>
  <div class="feats"><span>Menú con fotos</span><span>Ubicación</span><span>Horarios</span><span>Botón de WhatsApp</span></div>
  <div class="offer">
    <div class="price">$<b>197</b></div>
    <div class="pay">Lista en 48 h · Pagas <b>al final</b></div>
  </div>
  <div class="cta">
    <svg viewBox="0 0 24 24"><path d="M.057 24l1.687-6.163a11.867 11.867 0 01-1.587-5.945C.16 5.335 5.495 0 12.05 0a11.817 11.817 0 018.413 3.488 11.824 11.824 0 013.48 8.414c-.003 6.557-5.338 11.892-11.893 11.892a11.9 11.9 0 01-5.688-1.448L.057 24zm6.597-3.807c1.676.995 3.276 1.591 5.392 1.592 5.448 0 9.886-4.434 9.889-9.885.002-5.462-4.415-9.89-9.881-9.892-5.452 0-9.887 4.434-9.889 9.884a9.86 9.86 0 001.51 5.26l-.999 3.648 3.978-1.043z"/></svg>
    <div class="txt"><b>QUIERO LA MÍA</b><span>Mándame mensaje por WhatsApp</span></div>
  </div>
</div></div></body></html>
